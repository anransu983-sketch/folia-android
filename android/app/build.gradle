import groovy.json.JsonSlurper

// 当前文件：Folia Android 应用版本、SDK 与可选发布签名配置。

apply plugin: 'com.android.application'

def packageJson = new JsonSlurper().parseText(file('../../package.json').text)
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
def hasReleaseKeystore = keystorePropertiesFile.exists()

if (hasReleaseKeystore) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

// versionCode 必须每一版都往上走：装了旧版之后再装新版，版本号不涨会直接
// INSTALL_FAILED_VERSION_DOWNGRADE（必须先卸载）。原来硬编码 1，等于装过一次就再也
// 升不上去了 —— 应用内那个「检查更新」也跟着白做。
//
// 由 package.json 的 version 推出来：major*1000000 + minor*100000 + patch*100 + build
// （0.7.18 → 71800）。patch 与 build 各留两位（超过就截断 —— patch 到三位数本就该升 minor）。
//
// 第四位（`0.7.19.1` 里的 1）之前是不存在的：四位版本号被当成三段处理，于是
// `0.7.19` 和 `0.7.19.1` 得到**同一个** versionCode。同 code 覆盖安装算不上降级、
// 装得上，但系统会认为应用没变，WebView 那边可能照旧吃缓存 —— 装完还是旧页面。
// 让第四位也进 code，每一版就真的都在往上涨了。
def versionCodeOf = { String name ->
    def matched = (name =~ /^(\d+)\.(\d+)\.(\d+)(?:\.(\d+))?/)
    if (!matched.find()) {
        return 1
    }
    int major = matched.group(1) as int
    int minor = matched.group(2) as int
    int patch = Math.min(matched.group(3) as int, 99)
    int build = matched.group(4) ? Math.min(matched.group(4) as int, 99) : 0
    return major * 1000000 + minor * 100000 + patch * 100 + build
}

android {
    namespace = "top.izuna.foliamajor"
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }
    defaultConfig {
        applicationId "top.izuna.foliamajor"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode versionCodeOf(packageJson.version.toString())
        versionName packageJson.version
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // 后台播放：MediaSessionCompat 负责通知栏的控制项（播放/暂停/上下首），
    // NotificationCompat 负责前台通知。Web 层的 navigator.mediaSession 在 Android WebView
    // 里不会生成系统媒体通知，也没有前台服务的优先级，必须走原生这一套。
    implementation "androidx.media:media:1.7.0"
    // Lyricon 状态栏歌词：把当前歌曲与歌词推给系统的歌词中心，由它在状态栏渲染。
    // SDK 是 Kotlin 写的，Java 侧要显式传全部参数（Kotlin 默认参数对 Java 不可见）。
    implementation "io.github.proify.lyricon:provider:0.1.70"
    // 本地登录：内置的接口代码要直连各家音乐服务器，WebView 里过不了 CORS，
    // 由 FoliaNative 插件用 OkHttp 代发（同时用 CookieManager 管登录态）。
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    // 原生播放内核（P1）：ExoPlayer 负责解码出声，替代 WebView 的 <audio>。
    // 只在「设置 → 原生播放」打开时被用到；关着的时候这一层不参与任何播放。
    // ⚠️ 版本改动要看 media3 的 release notes：1.x 之间 API 有移动。
    implementation "androidx.media3:media3-exoplayer:1.11.1"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
